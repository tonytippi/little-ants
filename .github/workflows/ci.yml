name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: little_ants
          POSTGRES_PASSWORD: little_ants
          POSTGRES_DB: little_ants
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U little_ants"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://little_ants:little_ants@localhost:5432/little_ants
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @little-ants/db run migrate:deploy
      - run: pnpm turbo lint typecheck test build
      - run: pnpm format:check
