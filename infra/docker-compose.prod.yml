# Production stack on one host. Public traffic arrives through Cloudflare Tunnel, which points at
# these ports on 127.0.0.1 (nothing listens on a public interface):
#
#   la-admin.passionedu.org   → http://localhost:9200   (admin)
#   la-teacher.passionedu.org → http://localhost:9201   (teacher)
#   la-api.passionedu.org     → http://localhost:9202   (api; the browser apps and Google sign-in call it)
#   127.0.0.1:9203            → postgres, for psql and the importer on the host only
#
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d
#
# Settings and secrets come from the repository-root .env.production (template:
# infra/env.production.example). Hostnames, DATABASE_URL and NODE_ENV are set here.
# See docs/operations/deploy-and-restore.md.

name: little-ants

x-app-env: &app-env
  env_file: ../.env.production
  restart: unless-stopped
  networks: [internal]

x-server-env: &server-env
  NODE_ENV: production
  # Use a URL-safe POSTGRES_PASSWORD (e.g. openssl rand -hex 32): it is embedded in this URL.
  DATABASE_URL: postgresql://${POSTGRES_USER:-little_ants}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-little_ants}

# API settings, shared by the api service and by seed-test, which import-worker runs after each sync.
x-api-env: &api-env
  <<: *server-env
  API_PUBLIC_URL: https://${API_HOST:-la-api.passionedu.org}
  CORS_ORIGINS: https://${ADMIN_HOST:-la-admin.passionedu.org},https://${TEACHER_HOST:-la-teacher.passionedu.org}
  # Shares the session cookie between the admin, teacher and api hosts.
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.passionedu.org}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-little_ants}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-little_ants}
    ports:
      - '127.0.0.1:9203:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-little_ants}']
      interval: 10s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 1g }

  migrate:
    <<: *app-env
    environment: *server-env
    build: &build
      context: ..
      dockerfile: infra/Dockerfile
      target: migrate
      args:
        # Baked into the browser bundles at build time.
        NEXT_PUBLIC_API_URL: https://${API_HOST:-la-api.passionedu.org}
        NEXT_PUBLIC_TEACHER_APP_URL: https://${TEACHER_HOST:-la-teacher.passionedu.org}
        BUILD_ID: ${IMAGE_TAG:-local}
    restart: 'no'
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }

  # Curriculum import from Google Drive (GOOGLE_DRIVE_FOLDER_ID): writes the database and uploads to R2.
  # import-worker carries out "Sync from Google Drive" requests made in Admin (all units, overwriting Admin edits).
  # The import service runs the same importer by hand:
  #   docker compose ... --profile tools run --rm import                      (all units, with files)
  #   docker compose ... --profile tools run --rm import node tools/importer/dist/cli.js --drive --all --dry-run
  # Each sync first updates the Drive mirror in docs/Little Ants English/LA 3-6 (only changed files are downloaded)
  # and imports from it. Database backups land in infra/backup/ and reports of manual runs in infra/import-reports/.
  # A service account key, if used, goes in infra/secrets/ (GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE=/repo/infra/secrets/<file>.json).
  # Both run as the host user (HOST_UID, default 1000), so the files they write stay editable on the host.
  import-worker:
    <<: *app-env
    environment: &import-env
      <<: *api-env
      # Testing phase: every sync also approves and publishes the units as imported. Set to false before go-live.
      TEST_DATA_AFTER_SYNC: 'true'
    image: little-ants-importer:${IMAGE_TAG:-latest}
    build: { <<: *build, target: importer }
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /repo
    command: ['node', 'tools/importer/dist/cli.js', '--worker']
    volumes: &import-volumes
      - ./backup:/repo/infra/backup
      - ./import-reports:/repo/plans/reports
      - '../docs/Little Ants English:/repo/docs/Little Ants English'
      - ./secrets:/repo/infra/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 1g }

  import:
    <<: *app-env
    environment: *import-env
    image: little-ants-importer:${IMAGE_TAG:-latest}
    build: { <<: *build, target: importer }
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /repo
    restart: 'no'
    profiles: [tools]
    volumes: *import-volumes
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app-env
    image: little-ants-api:${IMAGE_TAG:-latest}
    build: { <<: *build, target: api }
    environment:
      <<: *api-env
      API_PORT: 3001
    ports:
      - '127.0.0.1:9202:3001'
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 768m }

  admin:
    <<: *app-env
    image: little-ants-admin:${IMAGE_TAG:-latest}
    build: { <<: *build, target: admin }
    ports:
      - '127.0.0.1:9200:3000'
    deploy:
      resources:
        limits: { memory: 512m }

  teacher:
    <<: *app-env
    image: little-ants-teacher:${IMAGE_TAG:-latest}
    build: { <<: *build, target: teacher }
    ports:
      - '127.0.0.1:9201:3002'
    deploy:
      resources:
        limits: { memory: 512m }

  # Optional: run the tunnel in Docker instead of cloudflared on the host
  # (add --profile tunnel). Its public hostnames then point at the container ports:
  # http://admin:3000, http://teacher:3002 and http://api:3001.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.2
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    profiles: [tunnel]
    depends_on: [api, admin, teacher]
    networks: [internal]

  # Nightly pg_dump to R2, kept for BACKUP_RETENTION_DAYS days.
  backup:
    <<: *app-env
    environment: *server-env
    build:
      context: backup-job
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:

networks:
  internal:
