# Local development services. Start with: docker compose -f infra/docker-compose.yml up -d
# A local PostgreSQL install works too; point DATABASE_URL at it instead.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: little_ants
      POSTGRES_PASSWORD: little_ants
      POSTGRES_DB: little_ants
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U little_ants']
      interval: 5s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2 during development.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: little-ants
      MINIO_ROOT_PASSWORD: little-ants-dev
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
